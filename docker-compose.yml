services:
  postgres:
    image: postgres:17
    container_name: banco-hidra-db
    environment:
      POSTGRES_DB: bancohidra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5433 no PC para não brigar com outro Postgres da aula na 5432
      - "127.0.0.1:5433:5432"
    volumes:
      - banco-hidra-dados:/var/lib/postgresql/data

volumes:
  banco-hidra-dados:
