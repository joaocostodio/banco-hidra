# Banco de dados (sobe com: docker compose up -d, na raiz do projeto; porta 5433)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/bancohidra
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/bancohidra
# Nos testes não há URL: o Quarkus sobe um Postgres descartável sozinho (Dev Services, via Docker)
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Hibernate cria/atualiza as tabelas a partir das entidades
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false
# Em dev usamos o Postgres do docker-compose, não um descartável
%dev.quarkus.datasource.devservices.enabled=false

# Login (JWT)
# Em dev e nos testes o Quarkus gera sozinho um par de chaves RSA para assinar os tokens.
# Em produção, aponte para chaves próprias (veja o README):
%prod.smallrye.jwt.sign.key.location=${BANCO_JWT_CHAVE_PRIVADA:chaves/privada.pem}
%prod.mp.jwt.verify.publickey.location=${BANCO_JWT_CHAVE_PUBLICA:chaves/publica.pem}
mp.jwt.verify.issuer=banco-hidra
smallrye.jwt.new-token.issuer=banco-hidra
# Validade do token: 1 hora
smallrye.jwt.new-token.lifespan=3600

# Administrador criado na primeira inicialização (se ainda não existir nenhum)
banco.admin.nome=Administrador Hidra
banco.admin.email=admin@hidra.com
banco.admin.senha=${BANCO_ADMIN_SENHA:hidra123}

# "Modo turma": em dev a API escuta na rede (não só no localhost), para os colegas acessarem pelo IP do PC.
%dev.quarkus.http.host=0.0.0.0

# Front-end Angular (4300 = Banco Hidra; 4200 = padrão do Angular).
# Aceita o site aberto pelo localhost ou por um IP de rede local (192.168.x.x, 10.x.x.x, 172.16-31.x.x).
quarkus.http.cors.enabled=true
# (Sem vírgulas nem barras invertidas na expressão: a configuração usa as duas como separador/escape.)
quarkus.http.cors.origins=/https?://(localhost|127[.]0[.]0[.]1|192[.]168[.][0-9]+[.][0-9]+|10[.][0-9]+[.][0-9]+[.][0-9]+|172[.](1[6-9]|2[0-9]|3[01])[.][0-9]+[.][0-9]+):(4300|4200)/
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept,Authorization
