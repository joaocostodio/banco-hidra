# Banco de dados (sobe com: docker compose up -d, na raiz do projeto; porta 5433)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/bancohidra
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/bancohidra
# Nos testes não há URL: o Quarkus sobe um Postgres descartável sozinho (Dev Services, via Docker)
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Hibernate cria/atualiza as tabelas a partir das entidades
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false
# Em dev usamos o Postgres do docker-compose, não um descartável
%dev.quarkus.datasource.devservices.enabled=false

# Login (JWT)
# Em dev e nos testes o Quarkus gera sozinho um par de chaves RSA para assinar os tokens.
# Em produção, aponte para chaves próprias (veja o README):
%prod.smallrye.jwt.sign.key.location=${BANCO_JWT_CHAVE_PRIVADA:chaves/privada.pem}
%prod.mp.jwt.verify.publickey.location=${BANCO_JWT_CHAVE_PUBLICA:chaves/publica.pem}
mp.jwt.verify.issuer=banco-hidra
smallrye.jwt.new-token.issuer=banco-hidra
# Validade do token: 1 hora
smallrye.jwt.new-token.lifespan=3600
# O token vem num cookie httpOnly (o JavaScript do site não o lê), e não no cabeçalho Authorization.
# O nome tem que ser o mesmo de CookieSessao.NOME.
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=hidra_sessao

# Administrador criado ao subir a API (se ainda não existir um com este login).
# O login pode ser um e-mail ou um nome de usuário simples. A senha daqui não passa pela regra de senha forte
# (é o dono do servidor quem escolhe); troque pelas variáveis BANCO_ADMIN_LOGIN / BANCO_ADMIN_SENHA.
banco.admin.nome=Administrador Hidra
banco.admin.email=${BANCO_ADMIN_LOGIN:joao}
banco.admin.senha=${BANCO_ADMIN_SENHA:moraes}
# Nos testes automáticos o administrador é outro (os testes não dependem da configuração local)
%test.banco.admin.email=admin@hidra.com
%test.banco.admin.senha=hidra123
# Nos testes, os rendimentos só são pagos quando o teste pede (sem a tarefa agendada rodando junto)
%test.quarkus.scheduler.enabled=false

# A API só escuta no próprio PC: os colegas (pelo IP ou pelo túnel) chegam nela através do site, que repassa
# /api para cá (web/proxy.conf.json). Assim só a porta do site (4300) fica aberta na rede.
%dev.quarkus.http.host=127.0.0.1

# CORS: o site fala com a API pelo mesmo endereço (o ng serve repassa /api para a porta 8080, ver
# web/proxy.conf.json). Só as origens do próprio site são aceitas: aberto pelo localhost, por um IP de rede
# local (192.168.x.x, 10.x.x.x, 172.16-31.x.x) ou pelo túnel da Cloudflare. Qualquer outro site é recusado,
# e sem essa liberação ele não consegue mandar o X-Requested-With que a ProtecaoCsrf exige.
# (Sem vírgulas nem barras invertidas dentro de cada expressão: a configuração usa as duas como separador/escape.)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/https?://(localhost|127[.]0[.]0[.]1|192[.]168[.][0-9]+[.][0-9]+|10[.][0-9]+[.][0-9]+[.][0-9]+|172[.](1[6-9]|2[0-9]|3[01])[.][0-9]+[.][0-9]+):4300/,/https://[a-z0-9-]+[.]trycloudflare[.]com/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept,X-Requested-With
quarkus.http.cors.access-control-allow-credentials=false
