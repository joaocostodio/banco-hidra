<h2 mat-dialog-title>Cadastrar chave Pix</h2>
<form [formGroup]="form" (ngSubmit)="salvar()" novalidate>
  <mat-dialog-content class="dialogo-largo">
    @if (erro()) {
      <div class="erro-geral" role="alert"><mat-icon>error</mat-icon>{{ erro() }}</div>
    }

    <mat-radio-group formControlName="tipo" class="tipos" aria-label="Tipo de chave">
      @for (t of tipos; track t) {
        <label class="tipo" [class.escolhido]="tipo() === t" [class.desligado]="t === 'CPF' && jaTemCpf">
          <mat-radio-button [value]="t" [disabled]="t === 'CPF' && jaTemCpf" />
          <mat-icon>{{ icones[t] }}</mat-icon>
          <span>{{ nomes[t] }}</span>
          @if (t === 'CPF' && jaTemCpf) {
            <small>já cadastrada</small>
          }
        </label>
      }
    </mat-radio-group>

    <p class="descricao">{{ descricao() }}</p>

    @if (tipo() === 'EMAIL') {
      <mat-form-field>
        <mat-label>E-mail</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
        <mat-error>Digite um e-mail válido</mat-error>
      </mat-form-field>
    } @else if (tipo() === 'TELEFONE') {
      <mat-form-field>
        <mat-label>Celular</mat-label>
        <input
          matInput
          class="num"
          formControlName="celular"
          inputmode="tel"
          placeholder="(55) 99999-0000"
          maxlength="15"
          (input)="formatarCelular()"
          autocomplete="tel-national"
        />
        <mat-error>Digite DDD + celular, ex. (55) 99999-0000</mat-error>
      </mat-form-field>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button matButton type="button" mat-dialog-close>Cancelar</button>
    <button matButton="filled" type="submit" [disabled]="enviando()">Cadastrar chave</button>
  </mat-dialog-actions>
</form>
