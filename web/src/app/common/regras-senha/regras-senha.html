<div class="forca" [class.fraca]="forca() > 0 && forca() < 3" aria-hidden="true">
  @for (t of tracos; track t) {
    <i [class.on]="forca() >= t"></i>
  }
</div>
<div class="rotulo" [class.fraca]="forca() < 3" aria-live="polite">{{ rotulo() }}</div>
<ul>
  @for (r of regras(); track r.texto) {
    <li [class.ok]="r.ok">
      <mat-icon [class.icone-cheio]="r.ok">{{ r.ok ? 'check_circle' : 'radio_button_unchecked' }}</mat-icon>
      {{ r.texto }}
    </li>
  }
</ul>
