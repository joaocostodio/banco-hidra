<h2 mat-dialog-title>
  @if (dados.icone) {
    <mat-icon [class.perigo]="dados.perigo">{{ dados.icone }}</mat-icon>
  }
  {{ dados.titulo }}
</h2>
<mat-dialog-content>
  <p>{{ dados.mensagem }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton mat-dialog-close>Cancelar</button>
  <button matButton="filled" [class.botao-perigo]="dados.perigo" [mat-dialog-close]="true" cdkFocusInitial>
    {{ dados.confirmar }}
  </button>
</mat-dialog-actions>
